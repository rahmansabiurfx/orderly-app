name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "infrastructure/**"
      - "LICENSE"

  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "infrastructure/**"
      - "LICENSE"

concurrency:
  group: orderly-app-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: orderly-app

permissions:
  contents: read
  id-token: write

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: TEST & LINT
  # ─────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Lint and format check with Ruff
        run: |
          ruff check app/
          ruff format --check app/

      - name: Run tests
        run: |
          python -m pytest app/tests/ -v --tb=short


  # ─────────────────────────────────────────────
  # JOB 2: BUILD, SCAN & PUSH
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_uri: ${{ steps.meta.outputs.uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "uri=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t ${{ steps.meta.outputs.uri }} \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.uri }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 5m

      - name: Push image to ECR
        run: |
          docker push ${{ steps.meta.outputs.uri }}


  # ─────────────────────────────────────────────
  # JOB 3: DEPLOY TO DEV (automatic)
  # ─────────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: build-and-push

    environment: dev

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: rahmansabiurfx/orderly-app-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Dev image tag
        run: |
          cd gitops

          TAG="${{ needs.build-and-push.outputs.image_tag }}"

          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" helm-chart/values-dev.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm-chart/values-dev.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy(dev): update image tag to ${TAG}"
            git push
          fi


  # ─────────────────────────────────────────────
  # JOB 4: DEPLOY TO STAGING (requires approval)
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: [deploy-dev, build-and-push]

    environment: staging

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: rahmansabiurfx/orderly-app-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Staging image tag
        run: |
          cd gitops

          TAG="${{ needs.build-and-push.outputs.image_tag }}"

          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" helm-chart/values-staging.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm-chart/values-staging.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy(staging): update image tag to ${TAG}"
            git push
          fi


  # ─────────────────────────────────────────────
  # JOB 5: DEPLOY TO PROD (requires approval)
  # ─────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Prod
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: [deploy-staging, build-and-push]

    environment: prod

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: rahmansabiurfx/orderly-app-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Prod image tag
        run: |
          cd gitops

          TAG="${{ needs.build-and-push.outputs.image_tag }}"

          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" helm-chart/values-prod.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm-chart/values-prod.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy(prod): update image tag to ${TAG}"
            git push
          fi